[project]
name = "embedding-generation"
version = "0.1.0"
description = "Generate OlmoEarth and Prithvi-EO-2.0 embeddings from Sentinel-2 for CONUS"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Core geospatial
    # Sherlock's manylinux_2_17 baseline cannot install rasterio>=1.4 wheels.
    "rasterio>=1.3,<1.4",
    "geopandas>=0.14",
    "shapely>=2.0",
    # Sherlock's manylinux_2_17 baseline cannot install pyproj>=3.7 wheels.
    "pyproj>=3.6,<3.7",
    "rioxarray>=0.15",
    # Sentinel-2 data access
    "pystac-client>=0.7",
    "odc-stac>=0.3",
    "planetary-computer>=0.5",
    # ML / inference
    # Sherlock's manylinux_2_17 baseline cannot install torch>=2.7 wheels.
    "torch>=2.1,<2.7",
    "torchvision>=0.16,<0.22",
    "transformers>=4.40",
    "timm>=0.9",
    "einops>=0.7",
    # OlmoEarth support imports olmoearth_pretrain lazily in embed.py; install
    # it separately when running --model olmoearth. Its current metadata pins
    # torch>=2.7, which is incompatible with Sherlock's manylinux baseline.
    # terratorch is optional; we load Prithvi via transformers trust_remote_code
    # "terratorch>=1.2rc4",
    # Analysis / output
    # Sherlock's manylinux_2_17 baseline cannot install newer scientific
    # wheels, and source builds are too fragile for array workers.
    "numpy>=1.26,<2.0",
    "scipy>=1.11,<1.12",
    "scikit-learn>=1.3,<1.4",
    "tqdm>=4.66",
    "pandas>=2.0,<2.3",
    # CLI
    "typer>=0.9",
    # Dask for lazy compositing
    "dask[array]>=2024.1",
    "ai2-olmo-core>=2.4.0",
    "class-registry>=2.1.2",
    "setuptools>=82.0.1",
    "matplotlib>=3.11.0",
]

[project.scripts]
embed-pipeline = "run:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
managed = true
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
