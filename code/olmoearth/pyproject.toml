[project]
name = "olmoearth-pull"
version = "0.1.0"
description = "Pull OlmoEarth Studio embeddings by census tract"
requires-python = ">=3.11,<3.14"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "geopandas>=0.14",
    "shapely>=2.0",
    "rasterio>=1.3",
    "numpy>=1.26",
    "tqdm>=4.66",
    "scikit-learn>=1.9.0",
    "matplotlib>=3.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
managed = true
